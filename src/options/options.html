<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TextLoom — Settings</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <div class="page-grain"></div>
    <div class="page">
        <div class="page-header">
            <h1>TextLoom</h1>
            <span class="page-version">v2</span>
        </div>
